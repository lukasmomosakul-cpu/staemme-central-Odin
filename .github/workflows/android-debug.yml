name: Android debug build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.15.0 --activate
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build web app for Capacitor
        run: pnpm build
      - name: Generate native Android project
        run: |
          pnpm cap:add:android
          pnpm cap:sync
      - name: Align Android minimum SDK
        working-directory: android
        run: |
          find . -type f \( -name '*.gradle' -o -name '*.gradle.kts' -o -name '*.xml' \) -print0 | xargs -0 sed -i -E 's/minSdkVersion[[:space:]]*=[[:space:]]*24/minSdkVersion = 26/g; s/minSdkVersion[[:space:]]+24/minSdkVersion 26/g'
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: teamzentrale-odin-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
