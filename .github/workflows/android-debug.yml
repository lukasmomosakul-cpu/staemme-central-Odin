name: Android debug build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable && corepack prepare pnpm@10.15.0 --activate
      - run: pnpm install --no-frozen-lockfile
      - name: Read version
        id: version
        run: |
          set -euo pipefail
          VERSION=$(tr -d '[:space:]' < VERSION)
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Build web app
        env:
          NEXT_PUBLIC_APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          rm -rf .next
          pnpm build
          grep -R -F -m1 -- "$NEXT_PUBLIC_APP_VERSION" .next >/dev/null
      - name: Generate Android project
        run: pnpm cap:add:android && pnpm cap:sync
      - name: Configure Android
        working-directory: android
        env:
          ODIN_VERSION: ${{ steps.version.outputs.version }}
          ODIN_KEYSTORE_BASE64: ${{ secrets.ODIN_KEYSTORE_BASE64 }}
          ODIN_KEYSTORE_PASSWORD: ${{ secrets.ODIN_KEYSTORE_PASSWORD }}
          ODIN_KEY_ALIAS: ${{ secrets.ODIN_KEY_ALIAS }}
          ODIN_KEY_PASSWORD: ${{ secrets.ODIN_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ODIN_KEYSTORE_BASE64"
          test -n "$ODIN_KEYSTORE_PASSWORD"
          test -n "$ODIN_KEY_ALIAS"
          test -n "$ODIN_KEY_PASSWORD"
          echo "$ODIN_KEYSTORE_BASE64" | base64 --decode > odin-release.jks
          test -s odin-release.jks
          bash ../native/build-android.sh
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('app/build.gradle')
          s = p.read_text()
          s, n = re.subn(r'(?m)^(\s*)minSdkVersion\s+.*$', r'\1minSdkVersion 26', s, count=1)
          if n == 0:
              s, n = re.subn(r'(?m)^(\s*)minSdk\s+.*$', r'\1minSdk 26', s, count=1)
          if n == 0:
              raise SystemExit('Could not locate Android minSdk declaration in app/build.gradle')
          p.write_text(s)
          print('Normalized app/build.gradle minSdk to 26')
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build and verify APK
        working-directory: android
        env:
          ODIN_KEYSTORE_PASSWORD: ${{ secrets.ODIN_KEYSTORE_PASSWORD }}
          ODIN_KEY_ALIAS: ${{ secrets.ODIN_KEY_ALIAS }}
          ODIN_KEY_PASSWORD: ${{ secrets.ODIN_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew assembleDebug -PminSdkVersion=26
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | grep -F "versionName='${{ steps.version.outputs.version }}'"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: teamzentrale-odin-debug-apk-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

# build trigger: verify current VERSION/minSdk fixes on a fresh runner
