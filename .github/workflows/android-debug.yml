name: Android debug build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      ODIN_KEYSTORE_BASE64: ${{ secrets.ODIN_KEYSTORE_BASE64 }}
      ODIN_KEYSTORE_PASSWORD: ${{ secrets.ODIN_KEYSTORE_PASSWORD }}
      ODIN_KEY_ALIAS: ${{ secrets.ODIN_KEY_ALIAS }}
      ODIN_KEY_PASSWORD: ${{ secrets.ODIN_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable && corepack prepare pnpm@10.15.0 --activate
      - run: pnpm install --no-frozen-lockfile
      - name: Read version
        id: version
        run: |
          set -euo pipefail
          VERSION=$(tr -d '[:space:]' < VERSION)
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Build web app
        env:
          NEXT_PUBLIC_APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          rm -rf .next
          pnpm build
          grep -R -F -m1 -- "$NEXT_PUBLIC_APP_VERSION" .next >/dev/null
      - name: Generate Android project
        run: pnpm cap:add:android && pnpm cap:sync
      - name: Configure and build Android
        working-directory: android
        env:
          ODIN_VERSION: ${{ steps.version.outputs.version }}
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          for name in ODIN_KEYSTORE_BASE64 ODIN_KEYSTORE_PASSWORD ODIN_KEY_ALIAS ODIN_KEY_PASSWORD; do
            test -n "${!name:-}" || { echo "Missing $name"; exit 1; }
          done
          mkdir -p app
          printf '%s' "$ODIN_KEYSTORE_BASE64" | base64 --decode > app/odin-release.jks
          test -s app/odin-release.jks
          # The generator historically emitted an over-escaped Python regex (\\b), causing AssertionError.
          # Normalize that generator typo in the checked-out script before executing it.
          python3 - <<'PY'
          from pathlib import Path
          p=Path('../native/build-android.sh')
          s=p.read_text()
          s=s.replace("r'<manifest\\\\b'", "r'<manifest\\b'")
          s=s.replace("r'<manifest\\\\b[^>]*>'", "r'<manifest\\b[^>]*>'")
          s=s.replace("r'<uses-sdk\\\\b[^>]*/>'", "r'<uses-sdk\\b[^>]*/>'")
          p.write_text(s)
          PY
          bash ../native/build-android.sh
          bash ../native/patch-godbot-loader.sh
          python3 - <<'PY'
          from pathlib import Path
          import re
          version=Path('../VERSION').read_text().strip()
          for p in Path('app/src/main/java').rglob('GameWebViewActivity.java'):
              s=p.read_text()
              s=re.sub(r'ODIN [0-9]+\.[0-9]+\.[0-9]+ · ',f'ODIN {version} · ',s)
              p.write_text(s)
          for p in Path('app/src/main/java').rglob('MainActivity.java'):
              s=p.read_text()
              s=re.sub(r'releases/download/v[0-9]+\.[0-9]+\.[0-9]+/odin-latest\.apk',f'releases/download/v{version}/odin-latest.apk',s)
              s=re.sub(r'odin-update-[0-9]+\.[0-9]+\.[0-9]+\.apk',f'odin-update-{version}.apk',s)
              s=s.replace('releases/latest/download/odin-latest.apk',f'releases/download/v{version}/odin-latest.apk')
              p.write_text(s)
          PY
          # Normalize literal backslash-n sequences emitted by the generator outside Java string literals.
          python3 - <<'PY'
          from pathlib import Path
          for name in ('app/build.gradle','app/src/main/AndroidManifest.xml'):
              p=Path(name)
              if p.exists():
                  s=p.read_text()
                  s=s.replace('\\\\n','\n')
                  p.write_text(s)
          PY
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('app/build.gradle')
          s=p.read_text()
          v=Path('../VERSION').read_text().strip()
          a=v.split('.')
          code=int(a[0])*1000000+int(a[1])*1000+int(a[2])
          s=re.sub(r'(?m)^(\s*versionCode)\s*(?:=\s*)?\d+\s*$',rf'\1 {code}',s,count=1)
          s=re.sub(r'(?m)^(\s*versionName)\s*(?:=\s*)?"[^"]*"\s*$',rf'\1 "{v}"',s,count=1)
          p.write_text(s)
          PY
          test -s app/src/main/assets/godbot.user.js
          test ! -e app/src/main/assets/odin-test.user.js
          ./gradlew assembleDebug -PminSdkVersion=26
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          BADGING=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")
          echo "$BADGING" | grep -F "versionName='${EXPECTED_VERSION}'"
          echo 'APK verified: version, signing and GodBot asset synchronized'
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: teamzentrale-odin-debug-apk-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
