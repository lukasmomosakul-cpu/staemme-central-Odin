name: Android debug build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      ODIN_NATIVE_SERVER_URL: ${{ secrets.ODIN_NATIVE_SERVER_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.15.0 --activate
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Prepare Capacitor web directory
        run: |
          mkdir -p out
          printf '<!doctype html><html><body></body></html>' > out/index.html
      - name: Generate native Android project
        run: |
          pnpm cap:add:android
          pnpm cap:sync
      - name: Install Odin native game WebView
        run: |
          mkdir -p android/app/src/main/java/de/teamzentrale/odin
          cat > android/app/src/main/java/de/teamzentrale/odin/GameWebViewPlugin.kt <<'EOF'
          package de.teamzentrale.odin

          import android.graphics.Color
          import android.view.ViewGroup
          import android.webkit.CookieManager
          import android.webkit.WebChromeClient
          import android.webkit.WebSettings
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.FrameLayout
          import android.widget.TextView
          import com.getcapacitor.Plugin
          import com.getcapacitor.PluginCall
          import com.getcapacitor.annotation.CapacitorPlugin
          import com.getcapacitor.annotation.PluginMethod

          @CapacitorPlugin(name = "GameWebView")
          class GameWebViewPlugin : Plugin() {
              private var gameContainer: FrameLayout? = null

              @PluginMethod
              fun open(call: PluginCall) {
                  val url = call.getString("url")
                  if (url.isNullOrBlank()) {
                      call.reject("Missing URL")
                      return
                  }

                  activity.runOnUiThread {
                      try {
                          val container = FrameLayout(activity).apply {
                              setBackgroundColor(Color.BLACK)
                          }

                          val close = TextView(activity).apply {
                              text = "  Die Stämme    ✕ Schließen"
                              setTextColor(Color.WHITE)
                              setBackgroundColor(Color.rgb(55, 43, 28))
                              textSize = 16f
                              setPadding(12, 18, 12, 18)
                              setOnClickListener { closeGame() }
                          }
                          container.addView(close, FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT))

                          val webView = WebView(activity)
                          webView.settings.apply {
                              javaScriptEnabled = true
                              domStorageEnabled = true
                              databaseEnabled = true
                              loadsImagesAutomatically = true
                              mixedContentMode = WebSettings.MIXED_CONTENT_NEVER_ALLOW
                          }
                          CookieManager.getInstance().setAcceptCookie(true)
                          CookieManager.getInstance().setAcceptThirdPartyCookies(webView, true)
                          webView.webChromeClient = WebChromeClient()
                          webView.webViewClient = object : WebViewClient() {
                              override fun onPageFinished(view: WebView, pageUrl: String) {
                                  super.onPageFinished(view, pageUrl)
                                  fillLoginFields(webView, call.getString("username") ?: "", call.getString("password") ?: "")
                              }
                          }
                          val webParams = FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 0)
                          webParams.topMargin = dp(58)
                          webParams.height = ViewGroup.LayoutParams.MATCH_PARENT
                          container.addView(webView, webParams)

                          val root = activity.findViewById<ViewGroup>(android.R.id.content)
                          root.addView(container, ViewGroup.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT))
                          gameContainer = container
                          webView.loadUrl(url)
                          call.resolve()
                      } catch (e: Exception) {
                          call.reject("Could not open native game WebView: ${e.message}", e)
                      }
                  }
              }

              private fun fillLoginFields(webView: WebView, username: String, password: String) {
                  if (username.isBlank() && password.isBlank()) return
                  val user = escapeJs(username)
                  val pass = escapeJs(password)
                  val script = """
                      (() => {
                        const u = '$user'; const p = '$pass';
                        const setValue = (el, value) => {
                          if (!el) return;
                          const setter = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value')?.set;
                          if (setter) setter.call(el, value); else el.value = value;
                          el.dispatchEvent(new Event('input', { bubbles: true }));
                          el.dispatchEvent(new Event('change', { bubbles: true }));
                        };
                        setValue(document.querySelector('#user') || document.querySelector('input[name="username"]'), u);
                        setValue(document.querySelector('#password') || document.querySelector('input[name="password"]'), p);
                      })();
                  """.trimIndent()
                  webView.postDelayed({ webView.evaluateJavascript(script, null) }, 300)
              }

              private fun closeGame() {
                  gameContainer?.let { (it.parent as? ViewGroup)?.removeView(it) }
                  gameContainer = null
              }

              private fun dp(value: Int): Int = (value * activity.resources.displayMetrics.density).toInt()

              private fun escapeJs(value: String): String = value
                  .replace("\\", "\\\\")
                  .replace("'", "\\'")
                  .replace("\n", "\\n")
                  .replace("\r", "\\r")
          }
          EOF

          cat > android/app/src/main/java/de/teamzentrale/odin/ExternalBrowserPlugin.kt <<'EOF'
          package de.teamzentrale.odin

          import android.content.ActivityNotFoundException
          import android.content.Intent
          import android.net.Uri
          import com.getcapacitor.Plugin
          import com.getcapacitor.PluginCall
          import com.getcapacitor.annotation.CapacitorPlugin
          import com.getcapacitor.annotation.PluginMethod

          @CapacitorPlugin(name = "ExternalBrowser")
          class ExternalBrowserPlugin : Plugin() {
              @PluginMethod
              fun open(call: PluginCall) {
                  val url = call.getString("url")
                  if (url.isNullOrBlank()) { call.reject("Missing URL"); return }
                  try {
                      activity.startActivity(Intent(Intent.ACTION_VIEW, Uri.parse(url)).apply { addCategory(Intent.CATEGORY_BROWSABLE) })
                      call.resolve()
                  } catch (e: ActivityNotFoundException) { call.reject("No browser available", e) }
                  catch (e: Exception) { call.reject("Could not open browser", e) }
              }
          }
          EOF

          cat > android/app/src/main/java/de/teamzentrale/odin/MainActivity.kt <<'EOF'
          package de.teamzentrale.odin

          import android.os.Bundle
          import com.getcapacitor.BridgeActivity

          class MainActivity : BridgeActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  registerPlugin(ExternalBrowserPlugin::class.java)
                  registerPlugin(GameWebViewPlugin::class.java)
                  super.onCreate(savedInstanceState)
              }
          }
          EOF
      - name: Align Android minimum SDK
        working-directory: android
        run: |
          find . -type f \( -name '*.gradle' -o -name '*.gradle.kts' -o -name '*.xml' \) -print0 | xargs -0 sed -i -E 's/minSdkVersion[[:space:]]*=[[:space:]]*24/minSdkVersion = 26/g; s/minSdkVersion[[:space:]]+24/minSdkVersion 26/g'
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: teamzentrale-odin-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
