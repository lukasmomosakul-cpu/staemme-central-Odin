name: Android debug build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      ODIN_KEYSTORE_BASE64: ${{ secrets.ODIN_KEYSTORE_BASE64 }}
      ODIN_KEYSTORE_PASSWORD: ${{ secrets.ODIN_KEYSTORE_PASSWORD }}
      ODIN_KEY_ALIAS: ${{ secrets.ODIN_KEY_ALIAS }}
      ODIN_KEY_PASSWORD: ${{ secrets.ODIN_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable && corepack prepare pnpm@10.15.0 --activate
      - run: pnpm install --no-frozen-lockfile
      - name: Read version
        id: version
        run: |
          set -euo pipefail
          VERSION=$(tr -d '[:space:]' < VERSION)
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Build web app
        env:
          NEXT_PUBLIC_APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          rm -rf .next
          pnpm build
          grep -R -F -m1 -- "$NEXT_PUBLIC_APP_VERSION" .next >/dev/null
      - name: Generate Android project
        run: pnpm cap:add:android && pnpm cap:sync
      - name: Validate signing secrets
        run: |
          set -euo pipefail
          for name in ODIN_KEYSTORE_BASE64 ODIN_KEYSTORE_PASSWORD ODIN_KEY_ALIAS ODIN_KEY_PASSWORD; do
            value="${!name:-}"
            if [ -z "$value" ]; then
              echo "ERROR: GitHub Actions secret $name is NOT available to this workflow run."
              echo "The secret may exist in Settings but was not injected into this run."
              exit 1
            fi
            echo "$name is available (length ${#value})"
          done
      - name: Configure Android
        working-directory: android
        env:
          ODIN_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          printf '%s' "$ODIN_KEYSTORE_BASE64" | base64 --decode > odin-release.jks
          test -s odin-release.jks
          python3 - <<'PY'
          from pathlib import Path
          p = Path('../native/build-android.sh')
          s = p.read_text()
          s = s.replace("r'<manifest\\\\b'", "r'<manifest\\b'")
          s = s.replace("r'<manifest\\\\b[^>]*>'", "r'<manifest\\b[^>]*>'")
          s = s.replace("r'<uses-sdk\\\\b[^>]*/>'", "r'<uses-sdk\\b[^>]*/>'")
          p.write_text(s)
          print('Normalized build-android.sh Python regex literals')
          PY
          bash ../native/build-android.sh
          bash ../native/patch-godbot-loader.sh
          python3 - <<'PY'
          from pathlib import Path
          for name in ('app/build.gradle', 'app/src/main/AndroidManifest.xml'):
              p = Path(name)
              if p.exists():
                  s = p.read_text()
                  if '\\n' in s:
                      p.write_text(s.replace('\\n', '\n'))
                      print(f'Normalized escaped newlines in {name}')
          java = Path('app/src/main/java')
          for p in java.rglob('GameWebViewActivity.java'):
              s = p.read_text()
              original = s
              s = s.replace("Color.rgb(15,20,35);", "Color.rgb(15,20,35));")
              s = s.replace("append('\\\\n')", "append('\\n')")
              if s != original:
                  p.write_text(s)
                  print(f'Normalized generated Java source: {p}')
          PY
          python3 - <<'PY'
          from pathlib import Path
          import re
          candidates = [Path('variables.gradle'), Path('app/build.gradle')]
          found = []
          for p in candidates:
              if not p.exists():
                  continue
              s = p.read_text()
              original = s
              s = re.sub(r'(?m)^(\s*)minSdkVersion\s*(?:=\s*)?.*$', r'\1minSdkVersion = 26' if p.name == 'variables.gradle' else r'\1minSdkVersion 26', s)
              s = re.sub(r'(?m)^(\s*)minSdk\s*(?:=\s*)?.*$', r'\1minSdk = 26' if p.name == 'variables.gradle' else r'\1minSdk 26', s)
              if s != original:
                  p.write_text(s)
              if 'minSdkVersion = 26' in s or re.search(r'(?m)^\s*minSdkVersion 26\s*$', s) or 'minSdk = 26' in s or re.search(r'(?m)^\s*minSdk 26\s*$', s):
                  found.append(str(p))
          if 'variables.gradle' in found:
              print('Forced Capacitor variables.gradle minSdk to 26')
          if 'app/build.gradle' in found:
              print('Forced app/build.gradle minSdk to 26')
          if not found:
              raise SystemExit('Could not locate an Android minSdk declaration')
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build and verify APK
        working-directory: android
        run: |
          set -euo pipefail
          ./gradlew assembleDebug -PminSdkVersion=26
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | grep -F "versionName='${{ steps.version.outputs.version }}'"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: teamzentrale-odin-debug-apk-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

# build trigger: explicit repository-secret validation
