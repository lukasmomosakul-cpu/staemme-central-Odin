name: Android debug build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.15.0 --activate

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Read app version
        id: version
        run: |
          set -euo pipefail
          VERSION=$(tr -d '[:space:]' < VERSION)
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "ODIN VERSION: $VERSION"

      - name: Build web app
        env:
          NEXT_PUBLIC_APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          rm -rf .next
          echo "Building web app with NEXT_PUBLIC_APP_VERSION=$NEXT_PUBLIC_APP_VERSION"
          pnpm build

          echo '--- VERIFY WEB VERSION ---'
          test -n "$NEXT_PUBLIC_APP_VERSION"

          if ! grep -R -F -m1 -- "$NEXT_PUBLIC_APP_VERSION" .next >/dev/null 2>&1; then
            echo "ERROR: app version $NEXT_PUBLIC_APP_VERSION was NOT embedded into the Next.js build"
            exit 1
          fi

          echo "Verified web build contains app version: $NEXT_PUBLIC_APP_VERSION"

      - name: Generate Capacitor Android project
        run: pnpm cap:add:android && pnpm cap:sync

      - name: Verify Capacitor web assets version
        working-directory: android
        env:
          ODIN_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          test -n "$ODIN_VERSION"

          if ! grep -R -F -m1 -- "$ODIN_VERSION" app/src/main/assets/public >/dev/null 2>&1; then
            echo "ERROR: app version $ODIN_VERSION was NOT copied into Capacitor Android web assets"
            exit 1
          fi

          echo "Verified Android web assets contain app version: $ODIN_VERSION"

      - name: Configure Android app version
        working-directory: android
        env:
          ODIN_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          p = Path('app/build.gradle')
          s = p.read_text()

          version_name = os.environ['ODIN_VERSION']
          parts = version_name.split('.')
          version_code = int(parts[0]) * 1000000 + int(parts[1]) * 1000 + int(parts[2])

          if not re.search(r'\bversionCode\s+\d+', s):
              raise SystemExit('Could not find versionCode in android/app/build.gradle')

          if not re.search(r'\bversionName\s+"[^"]+"', s):
              raise SystemExit('Could not find versionName in android/app/build.gradle')

          s = re.sub(
              r'\bversionCode\s+\d+',
              f'versionCode {version_code}',
              s,
              count=1
          )

          s = re.sub(
              r'\bversionName\s+"[^"]+"',
              f'versionName "{version_name}"',
              s,
              count=1
          )

          p.write_text(s)

          print(f'ODIN VERSION: {version_name} / versionCode {version_code}')

          if f'versionName "{version_name}"' not in s:
              raise SystemExit('VERSION NAME VERIFICATION FAILED')

          if f'versionCode {version_code}' not in s:
              raise SystemExit('VERSION CODE VERIFICATION FAILED')
          PY

      - name: Configure embedded Die-Stämme WebView
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail

          MAIN=$(find app/src/main -type f -name 'MainActivity.java' | head -n 1)
          test -n "$MAIN"

          PKG=$(sed -n 's/^package[[:space:]]\+\(.*\);/\1/p' "$MAIN" | head -n 1)
          test -n "$PKG"

          DIR=$(dirname "$MAIN")

          mkdir -p "$DIR"
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/xml

          cp ../native/game-scripts.js app/src/main/assets/game-scripts.js

          cat > app/src/main/res/xml/backup_rules.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <full-backup-content>
              <include domain="sharedpref" path="odin_app_login.xml" />
          </full-backup-content>
          EOF

          cat > app/src/main/res/xml/data_extraction_rules.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <data-extraction-rules>
              <cloud-backup>
                  <include domain="sharedpref" path="odin_app_login.xml" />
              </cloud-backup>
              <device-transfer>
                  <include domain="sharedpref" path="odin_app_login.xml" />
              </device-transfer>
          </data-extraction-rules>
          EOF

          cat > "$DIR/GameWebViewActivity.java" <<EOF
          package $PKG;

          import android.app.Activity;
          import android.os.Bundle;
          import android.graphics.Color;
          import android.webkit.CookieManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.io.BufferedInputStream;
          import java.io.BufferedReader;
          import java.io.ByteArrayOutputStream;
          import java.io.InputStreamReader;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.util.ArrayList;
          import java.util.List;

          public class GameWebViewActivity extends Activity {

            private static final String GAME_URL = "https://www.die-staemme.de/";

            private WebView webView;

            private String username = "";
            private String password = "";

            private final List<String> managedScripts = new ArrayList<>();

            @Override
            public void onCreate(Bundle state) {
              super.onCreate(state);

              username = getIntent().getStringExtra("username");
              password = getIntent().getStringExtra("password");

              if (username == null) username = "";
              if (password == null) password = "";

              String scriptsJson = getIntent().getStringExtra("scriptsJson");

              if (scriptsJson != null) {
                try {
                  JSONArray a = new JSONArray(scriptsJson);

                  for (int i = 0; i < a.length(); i++) {
                    JSONObject o = a.getJSONObject(i);
                    String source = o.optString("source", "");

                    if (source.startsWith("https://")) {
                      managedScripts.add(source);
                    }
                  }
                } catch (Exception ignored) {
                }
              }

              LinearLayout root = new LinearLayout(this);
              root.setOrientation(LinearLayout.VERTICAL);

              TextView toolbar = new TextView(this);
              toolbar.setText("  Odin  •  Die Stämme");
              toolbar.setTextColor(Color.WHITE);
              toolbar.setTextSize(16);
              toolbar.setGravity(android.view.Gravity.CENTER_VERTICAL);
              toolbar.setBackgroundColor(Color.rgb(11, 16, 32));
              toolbar.setPadding(16, 0, 16, 0);

              toolbar.setOnClickListener(v -> finish());

              root.addView(
                  toolbar,
                  new LinearLayout.LayoutParams(-1, 52)
              );

              webView = new WebView(this);

              WebSettings ws = webView.getSettings();
              ws.setJavaScriptEnabled(true);
              ws.setDomStorageEnabled(true);
              ws.setDatabaseEnabled(true);
              ws.setSupportZoom(false);
              ws.setBuiltInZoomControls(false);
              ws.setDisplayZoomControls(false);
              ws.setMixedContentMode(WebSettings.MIXED_CONTENT_NEVER_ALLOW);

              CookieManager cm = CookieManager.getInstance();
              cm.setAcceptCookie(true);
              cm.setAcceptThirdPartyCookies(webView, true);

              webView.setWebChromeClient(new WebChromeClient());

              webView.addJavascriptInterface(
                  new OdinBridge(),
                  "OdinNative"
              );

              webView.setWebViewClient(new WebViewClient() {

                @Override
                public boolean shouldOverrideUrlLoading(
                    WebView v,
                    WebResourceRequest r
                ) {
                  return false;
                }

                @Override
                public void onPageFinished(
                    WebView v,
                    String url
                ) {
                  injectManagedScripts(v);
                  prefillLogin(v);
                  loadEnabledScripts(v);
                }
              });

              root.addView(
                  webView,
                  new LinearLayout.LayoutParams(-1, 0, 1)
              );

              setContentView(root);

              webView.loadUrl(GAME_URL);
            }

            private void injectManagedScripts(WebView v) {
              try {
                StringBuilder b = new StringBuilder();

                BufferedReader r =
                    new BufferedReader(
                        new InputStreamReader(
                            getAssets().open("game-scripts.js")
                        )
                    );

                String line;

                while ((line = r.readLine()) != null) {
                  b.append(line).append('\n');
                }

                r.close();

                v.evaluateJavascript(
                    "(function(){"
                    + b
                    + "})()",
                    null
                );

              } catch (Exception ignored) {
              }
            }

            private void prefillLogin(WebView v) {

              if (username.isEmpty() && password.isEmpty()) {
                return;
              }

              final String u = JSONObject.quote(username);
              final String p = JSONObject.quote(password);

              String js =
                  "(function(){"
                  + "var U=" + u + ",P=" + p + ";"

                  + "function put(el,val){"
                  + "if(!el)return;"
                  + "try{"
                  + "var d=Object.getOwnPropertyDescriptor("
                  + "HTMLInputElement.prototype,'value');"
                  + "if(d&&d.set)d.set.call(el,val);"
                  + "else el.value=val;"
                  + "}catch(e){el.value=val;}"
                  + "['input','change','blur'].forEach(function(n){"
                  + "el.dispatchEvent(new Event(n,{bubbles:true}));"
                  + "});"
                  + "}"

                  + "function findUser(){"
                  + "var sels=["
                  + "'input[name=\"username\"]',"
                  + "'input[name=\"user\"]',"
                  + "'input[name=\"login\"]',"
                  + "'input[id=\"username\"]',"
                  + "'input[id=\"user\"]',"
                  + "'input[autocomplete=\"username\"]',"
                  + "'input[type=\"email\"]',"
                  + "'input[type=\"text\"]'"
                  + "];"

                  + "for(var i=0;i<sels.length;i++){"
                  + "var e=document.querySelector(sels[i]);"
                  + "if(e)return e;"
                  + "}"
                  + "return null;"
                  + "}"

                  + "function findPass(){"
                  + "var sels=["
                  + "'input[type=\"password\"]',"
                  + "'input[name*=\"pass\" i]',"
                  + "'input[id*=\"pass\" i]',"
                  + "'input[autocomplete=\"current-password\"]'"
                  + "];"

                  + "for(var i=0;i<sels.length;i++){"
                  + "var e=document.querySelector(sels[i]);"
                  + "if(e)return e;"
                  + "}"
                  + "return null;"
                  + "}"

                  + "function fill(){"
                  + "var user=findUser(),pass=findPass();"
                  + "if(user&&U)put(user,U);"
                  + "if(pass&&P)put(pass,P);"
                  + "return !!(user&&pass);"
                  + "}"

                  + "var tries=0;"
                  + "function loop(){"
                  + "if(fill()||++tries>=120)clearInterval(t);"
                  + "}"

                  + "fill();"
                  + "var t=setInterval(loop,250);"

                  + "setTimeout(fill,100);"
                  + "setTimeout(fill,500);"
                  + "setTimeout(fill,1000);"
                  + "setTimeout(fill,2000);"
                  + "setTimeout(fill,4000);"

                  + "})()";

              v.evaluateJavascript(js, null);
            }

            private void loadEnabledScripts(WebView v) {

              if (managedScripts.isEmpty()) {
                return;
              }

              String path = v.getUrl() == null ? "" : v.getUrl();

              boolean inWorld =
                  path.matches(
                      "(?i).*[/]game[.]php(?:[/].*)?.*"
                  )
                  ||
                  path.matches(
                      "(?i).*[?&]screen=[^&]+.*[?&]village=[^&]+.*"
                  );

              if (!inWorld) {
                return;
              }

              for (String source : managedScripts) {

                new Thread(() -> {

                  try {
                    String code = downloadScript(source);

                    if (code == null || code.isEmpty()) {
                      return;
                    }

                    final String q = JSONObject.quote(code);

                    runOnUiThread(() ->
                        v.evaluateJavascript(
                            "(function(){"
                            + "try{eval(" + q + ");}"
                            + "catch(e){"
                            + "console.error('[Odin] Scriptfehler',e);"
                            + "}"
                            + "})()",
                            null
                        )
                    );

                  } catch (Exception ignored) {
                  }

                }).start();
              }
            }

            private String downloadScript(String source) {

              HttpURLConnection c = null;

              try {

                c =
                    (HttpURLConnection)
                        new URL(source).openConnection();

                c.setConnectTimeout(15000);
                c.setReadTimeout(30000);

                c.setRequestProperty(
                    "User-Agent",
                    "Teamzentrale-Odin/1.0 Android WebView"
                );

                c.setRequestProperty(
                    "Accept",
                    "*/*"
                );

                int status = c.getResponseCode();

                if (status < 200 || status >= 300) {
                  return null;
                }

                BufferedInputStream in =
                    new BufferedInputStream(c.getInputStream());

                ByteArrayOutputStream out =
                    new ByteArrayOutputStream();

                byte[] buf = new byte[8192];

                int n;

                while ((n = in.read(buf)) != -1) {
                  out.write(buf, 0, n);
                }

                in.close();

                return out.toString("UTF-8");

              } catch (Exception e) {

                return null;

              } finally {

                if (c != null) {
                  c.disconnect();
                }
              }
            }

            @Override
            public void onBackPressed() {

              if (webView != null && webView.canGoBack()) {
                webView.goBack();
              } else {
                super.onBackPressed();
              }
            }

            private class OdinBridge {

              @JavascriptInterface
              public void minimize() {
                runOnUiThread(() -> finish());
              }
            }
          }
          EOF

          cat > "$MAIN" <<EOF
          package $PKG;

          import android.app.DownloadManager;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Environment;
          import android.os.Handler;
          import android.os.Looper;
          import android.webkit.CookieManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.webkit.WebView;

          import com.getcapacitor.BridgeActivity;

          import org.json.JSONObject;

          public class MainActivity extends BridgeActivity {

            private static final String PREFS = "odin_app_login";

            @Override
            public void onCreate(Bundle state) {

              super.onCreate(state);

              WebView v = getBridge().getWebView();

              WebSettings s = v.getSettings();

              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);

              CookieManager cm = CookieManager.getInstance();

              cm.setAcceptCookie(true);
              cm.setAcceptThirdPartyCookies(v, true);

              v.addJavascriptInterface(
                  new Object() {

                    @JavascriptInterface
                    public String getSavedAppLogin() {

                      try {

                        SharedPreferences p =
                            getSharedPreferences(
                                PREFS,
                                MODE_PRIVATE
                            );

                        JSONObject o = new JSONObject();

                        o.put(
                            "email",
                            p.getString("email", "")
                        );

                        o.put(
                            "password",
                            p.getString("password", "")
                        );

                        return o.toString();

                      } catch (Exception e) {

                        return "";
                      }
                    }

                    @JavascriptInterface
                    public void saveAppLogin(
                        String email,
                        String password
                    ) {

                      getSharedPreferences(
                          PREFS,
                          MODE_PRIVATE
                      )
                      .edit()
                      .putString(
                          "email",
                          email == null ? "" : email
                      )
                      .putString(
                          "password",
                          password == null ? "" : password
                      )
                      .apply();
                    }

                    @JavascriptInterface
                    public void clearSavedAppLogin() {

                      getSharedPreferences(
                          PREFS,
                          MODE_PRIVATE
                      )
                      .edit()
                      .clear()
                      .apply();
                    }

                    @JavascriptInterface
                    public void openGame(
                        String accountId,
                        String username,
                        String password,
                        String scriptsJson
                    ) {

                      Intent i =
                          new Intent(
                              MainActivity.this,
                              GameWebViewActivity.class
                          );

                      i.putExtra(
                          "accountId",
                          accountId
                      );

                      i.putExtra(
                          "username",
                          username == null
                              ? ""
                              : username
                      );

                      i.putExtra(
                          "password",
                          password == null
                              ? ""
                              : password
                      );

                      i.putExtra(
                          "scriptsJson",
                          scriptsJson == null
                              ? "[]"
                              : scriptsJson
                      );

                      startActivity(i);
                    }

                    @JavascriptInterface
                    public void updateApk() {

                      try {

                        String url =
                            "https://github.com/"
                            + "lukasmomosakul-cpu/"
                            + "staemme-central-Odin/"
                            + "releases/latest/download/"
                            + "odin-latest.apk";

                        DownloadManager dm =
                            (DownloadManager)
                                getSystemService(
                                    Context.DOWNLOAD_SERVICE
                                );

                        if (dm == null) {
                          return;
                        }

                        DownloadManager.Request req =
                            new DownloadManager.Request(
                                Uri.parse(url)
                            );

                        req.setTitle(
                            "Odin wird aktualisiert"
                        );

                        req.setDescription(
                            "Neueste Version wird heruntergeladen"
                        );

                        req.setNotificationVisibility(
                            DownloadManager.Request
                                .VISIBILITY_VISIBLE_NOTIFY_COMPLETED
                        );

                        req.setMimeType(
                            "application/vnd.android.package-archive"
                        );

                        req.setDestinationInExternalPublicDir(
                            Environment.DIRECTORY_DOWNLOADS,
                            "odin-update.apk"
                        );

                        long downloadId =
                            dm.enqueue(req);

                        Handler handler =
                            new Handler(
                                Looper.getMainLooper()
                            );

                        Runnable checkDownload =
                            new Runnable() {

                              @Override
                              public void run() {

                                DownloadManager.Query query =
                                    new DownloadManager.Query();

                                query.setFilterById(
                                    downloadId
                                );

                                android.database.Cursor c =
                                    dm.query(query);

                                if (c != null) {

                                  try {

                                    if (c.moveToFirst()) {

                                      int status =
                                          c.getInt(
                                              c.getColumnIndexOrThrow(
                                                  DownloadManager
                                                      .COLUMN_STATUS
                                              )
                                          );

                                      if (
                                          status ==
                                          DownloadManager
                                              .STATUS_SUCCESSFUL
                                      ) {

                                        Uri uri =
                                            dm.getUriForDownloadedFile(
                                                downloadId
                                            );

                                        if (uri != null) {

                                          Intent install =
                                              new Intent(
                                                  Intent.ACTION_VIEW
                                              );

                                          install.setDataAndType(
                                              uri,
                                              "application/vnd.android.package-archive"
                                          );

                                          install.addFlags(
                                              Intent.FLAG_GRANT_READ_URI_PERMISSION
                                              |
                                              Intent.FLAG_ACTIVITY_NEW_TASK
                                          );

                                          startActivity(install);
                                        }

                                        return;
                                      }

                                      if (
                                          status ==
                                          DownloadManager
                                              .STATUS_FAILED
                                      ) {

                                        return;
                                      }
                                    }

                                  } finally {

                                    c.close();
                                  }
                                }

                                handler.postDelayed(
                                    this,
                                    500
                                );
                              }
                            };

                        handler.post(checkDownload);

                      } catch (Exception ignored) {
                      }
                    }

                  },
                  "Android"
              );
            }
          }
          EOF

          python3 - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          p = Path('app/src/main/AndroidManifest.xml')

          s = p.read_text(encoding='utf-8')

          if '<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />' not in s:
              manifest_match = re.search(r'<manifest\b', s)

              if not manifest_match:
                  raise SystemExit(
                      'Could not find <manifest> in AndroidManifest.xml'
                  )

              manifest_end = s.find('>', manifest_match.start())

              if manifest_end < 0:
                  raise SystemExit(
                      'Malformed <manifest> opening tag'
                  )

              permission = (
                  '\n'
                  '    <uses-permission '
                  'android:name="android.permission.REQUEST_INSTALL_PACKAGES" />'
              )

              s = (
                  s[:manifest_end + 1]
                  + permission
                  + s[manifest_end + 1:]
              )

          if 'android:allowBackup=' not in s:

              m = re.search(
                  r'<application\b',
                  s
              )

              if not m:
                  raise SystemExit(
                      'Could not find <application> in AndroidManifest.xml'
                  )

              end = s.find(
                  '>',
                  m.start()
              )

              if end < 0:
                  raise SystemExit(
                      'Malformed <application> opening tag'
                  )

              attrs = (
                  ' android:allowBackup="true"'
                  ' android:fullBackupContent="@xml/backup_rules"'
                  ' android:dataExtractionRules="@xml/data_extraction_rules"'
              )

              s = (
                  s[:end]
                  + attrs
                  + s[end:]
              )

          if 'android:name=".GameWebViewActivity"' not in s:

              pos = s.rfind('</application>')

              if pos < 0:
                  raise SystemExit(
                      'Could not find </application>'
                  )

              activity = (
                  '    <activity '
                  'android:name=".GameWebViewActivity" '
                  'android:exported="false" />\n'
              )

              s = (
                  s[:pos]
                  + activity
                  + s[pos:]
              )

          p.write_text(
              s,
              encoding='utf-8'
          )

          ET.parse(p)

          print('--- AndroidManifest.xml ---')
          print(s)
          print('--- XML VALID ---')
          PY

      - name: Align Android minimum SDK
        working-directory: android
        run: |
          find . -type f \
            \( -name '*.gradle' -o -name '*.gradle.kts' -o -name '*.xml' \) \
            -print0 |
            xargs -0 sed -i -E \
            's/minSdkVersion[[:space:]]*=[[:space:]]*24/minSdkVersion = 26/g;
             s/minSdkVersion[[:space:]]+24/minSdkVersion 26/g'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Configure stable Android signing
        working-directory: android
        env:
          ODIN_KEYSTORE_BASE64: ${{ secrets.ODIN_KEYSTORE_BASE64 }}
          ODIN_KEYSTORE_PASSWORD: ${{ secrets.ODIN_KEYSTORE_PASSWORD }}
          ODIN_KEY_ALIAS: ${{ secrets.ODIN_KEY_ALIAS }}
          ODIN_KEY_PASSWORD: ${{ secrets.ODIN_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          test -n "$ODIN_KEYSTORE_BASE64" || {
            echo "Missing ODIN_KEYSTORE_BASE64 GitHub secret"
            exit 1
          }

          test -n "$ODIN_KEYSTORE_PASSWORD" || {
            echo "Missing ODIN_KEYSTORE_PASSWORD GitHub secret"
            exit 1
          }

          test -n "$ODIN_KEY_ALIAS" || {
            echo "Missing ODIN_KEY_ALIAS GitHub secret"
            exit 1
          }

          test -n "$ODIN_KEY_PASSWORD" || {
            echo "Missing ODIN_KEY_PASSWORD GitHub secret"
            exit 1
          }

          CLEAN_B64=$(printf '%s' "$ODIN_KEYSTORE_BASE64" | tr -d '[:space:]')

          printf '%s' "$CLEAN_B64" |
            base64 --decode > odin-release.jks

          test -s odin-release.jks

          keytool -list \
            -keystore odin-release.jks \
            -storepass "$ODIN_KEYSTORE_PASSWORD" \
            -alias "$ODIN_KEY_ALIAS" >/dev/null

          cp odin-release.jks app/odin-release.jks

          test -s app/odin-release.jks

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('app/build.gradle')
          s = p.read_text()

          if 'storeFile file("odin-release.jks")' not in s:
              s = s.replace(
                  'android {',
                  '''android {
              signingConfigs {
                  release {
                      storeFile file("odin-release.jks")
                      storePassword System.getenv("ODIN_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ODIN_KEY_ALIAS")
                      keyPassword System.getenv("ODIN_KEY_PASSWORD")
                  }
              }''',
                  1
              )

          if 'debug {' not in s or 'signingConfig signingConfigs.release' not in s:
              s = s.replace(
                  'buildTypes {\n',
                  '''buildTypes {
                      debug {
                          signingConfig signingConfigs.release
                      }
                  ''',
                  1
              )

          if re.search(
              r'release\s*\{[^}]*signingConfig\s+signingConfigs\.release',
              s,
              re.S
          ) is None:
              s = s.replace(
                  'buildTypes {\n',
                  '''buildTypes {
                      release {
                          signingConfig signingConfigs.release
                      }
                  ''',
                  1
              )

          p.write_text(s)
          PY

          echo '--- signing/buildTypes ---'
          grep -n -A8 -B2 \
            'signingConfigs\|buildTypes' \
            app/build.gradle

      - name: Build update-safe APK
        working-directory: android
        env:
          ODIN_KEYSTORE_PASSWORD: ${{ secrets.ODIN_KEYSTORE_PASSWORD }}
          ODIN_KEY_ALIAS: ${{ secrets.ODIN_KEY_ALIAS }}
          ODIN_KEY_PASSWORD: ${{ secrets.ODIN_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          ./gradlew assembleDebug

          echo '--- APK identity ---'

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify \
            --verbose \
            --print-certs \
            app/build/outputs/apk/debug/app-debug.apk

          echo '--- APK version ---'

          "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            dump badging \
            app/build/outputs/apk/debug/app-debug.apk |
            grep -E 'package:|versionCode=|versionName='

          echo '--- APK VERSION HARD CHECK ---'

          "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            dump badging \
            app/build/outputs/apk/debug/app-debug.apk |
            grep -F \
            "versionName='${{ steps.version.outputs.version }}'"

          echo '--- APK VERSION VERIFIED ---'

      - name: Give APK a unique filename
        run: |
          cp \
            android/app/build/outputs/apk/debug/app-debug.apk \
            "android/app/build/outputs/apk/debug/teamzentrale-odin-${GITHUB_RUN_NUMBER}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: teamzentrale-odin-debug-apk-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/teamzentrale-odin-${{ github.run_number }}.apk