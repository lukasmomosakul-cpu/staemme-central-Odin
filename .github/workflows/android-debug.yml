name: Android debug build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.15.0 --activate
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Read version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(tr -d '[:space:]' < VERSION)
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "ODIN VERSION: $VERSION"
      - name: Build web app
        shell: bash
        env:
          NEXT_PUBLIC_APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          rm -rf .next
          pnpm build
          grep -R -F -m1 -- "$NEXT_PUBLIC_APP_VERSION" .next >/dev/null
      - name: Generate Android project
        shell: bash
        run: pnpm cap:add:android && pnpm cap:sync
      - name: Configure Android
        working-directory: android
        shell: bash
        env:
          ODIN_VERSION: ${{ steps.version.outputs.version }}
          ODIN_KEYSTORE_BASE64: ${{ secrets.ODIN_KEYSTORE_BASE64 }}
          ODIN_KEYSTORE_PASSWORD: ${{ secrets.ODIN_KEYSTORE_PASSWORD }}
          ODIN_KEY_ALIAS: ${{ secrets.ODIN_KEY_ALIAS }}
          ODIN_KEY_PASSWORD: ${{ secrets.ODIN_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ODIN_KEYSTORE_BASE64"
          test -n "$ODIN_KEYSTORE_PASSWORD"
          test -n "$ODIN_KEY_ALIAS"
          test -n "$ODIN_KEY_PASSWORD"
          echo "$ODIN_KEYSTORE_BASE64" | base64 --decode > odin-release.jks
          bash ../native/build-android.sh

          # Capacitor's generated project can source minSdk from variables.gradle or app/build.gradle.
          # Rewrite both deterministically; do not rely on sed backreferences, which can turn \1 + 26 into an invalid reference.
          python3 - <<'PY'
          from pathlib import Path
          import re

          def force_sdk(path: Path):
              if not path.exists():
                  return
              s = path.read_text()
              s = re.sub(r'\bminSdkVersion\s*=\s*\d+', 'minSdkVersion = 26', s)
              s = re.sub(r'\bminSdkVersion\s+\d+', 'minSdkVersion 26', s)
              s = re.sub(r'\bminSdk\s*=\s*\d+', 'minSdk = 26', s)
              s = re.sub(r'\bminSdk\s+\d+', 'minSdk 26', s)
              path.write_text(s)

          force_sdk(Path('variables.gradle'))
          force_sdk(Path('app/build.gradle'))

          p = Path('app/build.gradle')
          s = p.read_text()
          if not re.search(r'\bminSdkVersion\s+26\b|\bminSdk\s+26\b', s):
              s = s.replace('defaultConfig {', 'defaultConfig {\n        minSdkVersion 26', 1)
              p.write_text(s)
          PY

          echo '--- Android SDK configuration ---'
          grep -R -nE 'minSdk(Version)?|targetSdk' variables.gradle app/build.gradle 2>/dev/null || true
          grep -R -nE 'minSdkVersion[[:space:]]+26|minSdk[[:space:]]+26' variables.gradle app/build.gradle >/dev/null
          grep -R -F -m1 -- "$ODIN_VERSION" app/src/main/assets/public >/dev/null
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build and verify APK
        working-directory: android
        shell: bash
        env:
          ODIN_KEYSTORE_PASSWORD: ${{ secrets.ODIN_KEYSTORE_PASSWORD }}
          ODIN_KEY_ALIAS: ${{ secrets.ODIN_KEY_ALIAS }}
          ODIN_KEY_PASSWORD: ${{ secrets.ODIN_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew assembleDebug -PminSdkVersion=26
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | grep -F "versionName='${{ steps.version.outputs.version }}'"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: teamzentrale-odin-debug-apk-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
