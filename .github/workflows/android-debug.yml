name: Android debug build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.15.0 --activate
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build web app
        run: pnpm build
      - name: Generate Capacitor Android project
        run: pnpm cap:add:android && pnpm cap:sync
      - name: Configure embedded Die-Stämme WebView
        working-directory: android
        shell: bash
        run: |
          MAIN=$(find app/src/main -type f -name 'MainActivity.java' | head -n 1)
          PKG=$(sed -n 's/^package[[:space:]]\+\(.*\);/\1/p' "$MAIN" | head -n 1)
          DIR=$(dirname "$MAIN")
          mkdir -p "$DIR" app/src/main/assets
          cp ../native/game-scripts.js app/src/main/assets/game-scripts.js
          cat > "$DIR/GameWebViewActivity.java" <<EOF
          package $PKG;

          import android.app.Activity;
          import android.os.Bundle;
          import android.graphics.Color;
          import android.webkit.CookieManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import org.json.JSONArray;
          import org.json.JSONObject;
          import java.io.BufferedReader;
          import java.io.InputStreamReader;
          import java.io.BufferedInputStream;
          import java.io.ByteArrayOutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.util.ArrayList;
          import java.util.List;

          public class GameWebViewActivity extends Activity {
            private static final String GAME_URL = "https://www.die-staemme.de/";
            private WebView webView;
            private String username = "";
            private String password = "";
            private final List<String> managedScripts = new ArrayList<>();

            @Override public void onCreate(Bundle state) {
              super.onCreate(state);
              username = getIntent().getStringExtra("username");
              password = getIntent().getStringExtra("password");
              if (username == null) username = "";
              if (password == null) password = "";

              String scriptsJson = getIntent().getStringExtra("scriptsJson");
              if (scriptsJson != null) {
                try {
                  JSONArray a = new JSONArray(scriptsJson);
                  for (int i=0;i<a.length();i++) {
                    JSONObject o=a.getJSONObject(i);
                    String source=o.optString("source","");
                    if (source.startsWith("https://")) managedScripts.add(source);
                  }
                } catch(Exception ignored) {}
              }

              LinearLayout root = new LinearLayout(this);
              root.setOrientation(LinearLayout.VERTICAL);
              TextView toolbar = new TextView(this);
              toolbar.setText("  Odin  •  Die Stämme");
              toolbar.setTextColor(Color.WHITE);
              toolbar.setTextSize(16);
              toolbar.setGravity(android.view.Gravity.CENTER_VERTICAL);
              toolbar.setBackgroundColor(Color.rgb(11,16,32));
              toolbar.setPadding(16,0,16,0);
              toolbar.setOnClickListener(v -> finish());
              root.addView(toolbar, new LinearLayout.LayoutParams(-1,52));

              webView = new WebView(this);
              WebSettings s = webView.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setDatabaseEnabled(true);
              s.setSupportZoom(false);
              s.setBuiltInZoomControls(false);
              s.setDisplayZoomControls(false);
              s.setMixedContentMode(WebSettings.MIXED_CONTENT_NEVER_ALLOW);
              CookieManager cm = CookieManager.getInstance();
              cm.setAcceptCookie(true);
              cm.setAcceptThirdPartyCookies(webView,true);
              webView.setWebChromeClient(new WebChromeClient());
              webView.addJavascriptInterface(new OdinBridge(),"OdinNative");
              webView.setWebViewClient(new WebViewClient() {
                @Override public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) { return false; }
                @Override public void onPageFinished(WebView v,String url) {
                  injectManagedScripts(v);
                  prefillLogin(v);
                  loadEnabledScripts(v);
                }
              });
              root.addView(webView,new LinearLayout.LayoutParams(-1,0,1));
              setContentView(root);
              webView.loadUrl(GAME_URL);
            }

            private void injectManagedScripts(WebView v) {
              try {
                StringBuilder b=new StringBuilder();
                BufferedReader r=new BufferedReader(new InputStreamReader(getAssets().open("game-scripts.js")));
                String line; while((line=r.readLine())!=null) b.append(line).append('\\n');
                r.close();
                v.evaluateJavascript("javascript:(function(){"+b+"})()",null);
              } catch(Exception ignored) {}
            }

            private void prefillLogin(WebView v) {
              if(username.isEmpty() && password.isEmpty()) return;
              final String u=JSONObject.quote(username), p=JSONObject.quote(password);
              String js="javascript:(function(){"+
                "var u="+u+",p="+p+";"+
                "function setValue(el,val){if(!el)return;var setter=Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,'value')?.set;if(setter)setter.call(el,val);else el.value=val;el.dispatchEvent(new Event('input',{bubbles:true}));el.dispatchEvent(new Event('change',{bubbles:true}));}"+
                "function fill(){"+
                "var a=Array.prototype.slice.call(document.querySelectorAll('input'));"+
                "var user=a.find(function(x){var n=(x.name||'').toLowerCase(),i=(x.id||'').toLowerCase(),c=(x.autocomplete||'').toLowerCase(),ph=(x.placeholder||'').toLowerCase();return x.type!=='hidden'&&(n==='username'||n==='user'||n==='login'||i==='username'||i==='user'||i.indexOf('login')>=0||c==='username'||ph.indexOf('benutzer')>=0||ph.indexOf('username')>=0||ph.indexOf('login')>=0||ph.indexOf('user')>=0);})||a.find(function(x){return x.type==='text'||x.type==='email';});"+
                "var pass=a.find(function(x){var n=(x.name||'').toLowerCase(),i=(x.id||'').toLowerCase(),ph=(x.placeholder||'').toLowerCase(),a=(x.autocomplete||'').toLowerCase();return x.type==='password'||n.indexOf('pass')>=0||i.indexOf('pass')>=0||ph.indexOf('pass')>=0||a==='current-password';});"+
                "if(user&&u)setValue(user,u);if(pass&&p)setValue(pass,p);return !!(user&&pass);}"+
                "var n=0,t=setInterval(function(){if(fill()||++n>60)clearInterval(t);},500);fill();})()";
              v.evaluateJavascript(js,null);
            }

            private void loadEnabledScripts(WebView v) {
              if (managedScripts.isEmpty()) return;
              String path = v.getUrl() == null ? "" : v.getUrl();
              boolean inWorld = path.matches("(?i).*[/]game[.]php(?:[/].*)?.*") || path.matches("(?i).*[?&]screen=[^&]+.*[?&]village=[^&]+.*");
              if (!inWorld) return;
              for (String source : managedScripts) {
                new Thread(() -> {
                  try {
                    String code = downloadScript(source);
                    if (code == null || code.isEmpty()) return;
                    final String quoted = JSONObject.quote(code);
                    runOnUiThread(() -> {
                      String js="javascript:(function(){try{var s="+quoted+";eval(s);console.log('[Odin] Script geladen: '+"+JSONObject.quote(source)+");}catch(e){console.error('[Odin] Scriptfehler '+"+JSONObject.quote(source)+",e);}})()";
                      v.evaluateJavascript(js,null);
                    });
                  } catch(Exception ignored) {}
                }).start();
              }
            }

            private String downloadScript(String source) {
              HttpURLConnection c=null;
              try {
                c=(HttpURLConnection)new URL(source).openConnection();
                c.setConnectTimeout(15000);
                c.setReadTimeout(30000);
                c.setRequestProperty("User-Agent","Teamzentrale-Odin/1.0 Android WebView");
                c.setRequestProperty("Accept","*/*");
                int status=c.getResponseCode();
                if(status<200 || status>=300) return null;
                BufferedInputStream in=new BufferedInputStream(c.getInputStream());
                ByteArrayOutputStream out=new ByteArrayOutputStream();
                byte[] buf=new byte[8192]; int n;
                while((n=in.read(buf))!=-1) out.write(buf,0,n);
                in.close();
                return out.toString("UTF-8");
              } catch(Exception e) { return null; }
              finally { if(c!=null) c.disconnect(); }
            }

            @Override public void onBackPressed() {
              if(webView!=null && webView.canGoBack()) webView.goBack(); else super.onBackPressed();
            }

            private class OdinBridge {
              @JavascriptInterface public void minimize() { runOnUiThread(() -> finish()); }
            }
          }
          EOF

          cat > "$MAIN" <<EOF
          package $PKG;
          import android.content.Intent;
          import android.os.Bundle;
          import android.webkit.CookieManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override public void onCreate(Bundle state) {
              super.onCreate(state);
              WebView v=getBridge().getWebView();
              WebSettings s=v.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              CookieManager cm=CookieManager.getInstance();
              cm.setAcceptCookie(true);
              cm.setAcceptThirdPartyCookies(v,true);
              v.addJavascriptInterface(new Object(){
                @JavascriptInterface public void openGame(String accountId,String username,String password,String scriptsJson){
                  Intent i=new Intent(MainActivity.this,GameWebViewActivity.class);
                  i.putExtra("accountId",accountId);
                  i.putExtra("username",username==null?"":username);
                  i.putExtra("password",password==null?"":password);
                  i.putExtra("scriptsJson",scriptsJson==null?"[]":scriptsJson);
                  startActivity(i);
                }
              },"Android");
            }
          }
          EOF

          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/AndroidManifest.xml')
          s=p.read_text()
          if 'GameWebViewActivity' not in s:
              s=s.replace('</application>','    <activity android:name=".GameWebViewActivity" android:exported="false" />\n    </application>')
              p.write_text(s)
          PY
      - name: Align Android minimum SDK
        working-directory: android
        run: find . -type f \( -name '*.gradle' -o -name '*.gradle.kts' -o -name '*.xml' \) -print0 | xargs -0 sed -i -E 's/minSdkVersion[[:space:]]*=[[:space:]]*24/minSdkVersion = 26/g; s/minSdkVersion[[:space:]]+24/minSdkVersion 26/g'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Give APK a unique filename
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "android/app/build/outputs/apk/debug/teamzentrale-odin-${GITHUB_RUN_NUMBER}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: teamzentrale-odin-debug-apk-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/teamzentrale-odin-${{ github.run_number }}.apk
