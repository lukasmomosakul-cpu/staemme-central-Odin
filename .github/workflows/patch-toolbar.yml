name: Patch game toolbar safe area

on:
  push:
    branches: [main]
    paths:
      - VERSION

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch Android generator
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/android-debug.yml')
          s = p.read_text()
          old = '              root.addView(toolbar, new LinearLayout.LayoutParams(-1, 52));'
          new = '''              LinearLayout.LayoutParams toolbarParams = new LinearLayout.LayoutParams(-1, 52);\n              toolbarParams.topMargin = (int) (32 * getResources().getDisplayMetrics().density);\n              root.addView(toolbar, toolbarParams);'''
          if old not in s:
              raise SystemExit('Toolbar line not found; refusing to modify workflow')
          if 'toolbarParams.topMargin' not in s:
              s = s.replace(old, new, 1)
              p.write_text(s)
          PY

      - name: Commit toolbar fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- .github/workflows/android-debug.yml; then
            echo 'Toolbar fix already present'
          else
            git add .github/workflows/android-debug.yml
            git commit -m 'fix: move game toolbar below status bar'
            git push
          fi

      - name: Remove patch workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/patch-toolbar.yml
          git add .github/workflows/patch-toolbar.yml
          git commit -m 'chore: remove temporary toolbar patch workflow'
          git push
