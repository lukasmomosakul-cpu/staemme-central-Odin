name: Publish APK release

on:
  workflow_run:
    workflows: ["Android debug build"]
    types: [completed]

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Read version from triggering commit
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/contents/VERSION?ref=${RUN_SHA}" --jq '.content' | base64 -d | tr -d '[:space:]' > VERSION
          VERSION_NAME=$(cat VERSION)
          echo "$VERSION_NAME" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: teamzentrale-odin-debug-apk-${{ github.event.workflow_run.run_number }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          path: release

      - name: Prepare stable APK filename
        run: |
          set -euo pipefail
          APK=$(find release -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          cp "$APK" release/odin-latest.apk
          ls -lh release/odin-latest.apk

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"
          TAG="v${VERSION}"
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" release/odin-latest.apk --clobber --repo "$REPO"
          else
            gh release create "$TAG" release/odin-latest.apk --title "Odin $VERSION" --notes "Teamzentrale Odin $VERSION" --latest --repo "$REPO"
          fi
